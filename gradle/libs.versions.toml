[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.59.2"
androidx-hilt = "1.4.0"
androidx-annotation = "1.9.1"
compose-bom = "2026.11.01"
navigation-compose = "2.10.2"
core-splashscreen = "1.2.0"
activity-compose = "1.14.0-alpha03"
lifecycle = "2.11.0-alpha01"
datastore = "1.3.0"
coroutines = "1.10.2"
immutable = "0.4.0"
serialization = "1.9.0"
timber = "5.0.1"
